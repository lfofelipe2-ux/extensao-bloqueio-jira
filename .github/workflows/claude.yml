# Claude Code answers "@claude" in issues, PRs, comments and reviews (anthropics/claude-code-action).
# Auth: the CLAUDE_CODE_OAUTH_TOKEN secret (subscription login from `claude setup-token`).
# Needs the Claude GitHub App on the repo. Repos with a self-hosted runner can set the repo variable
# CLAUDE_RUNNER (JSON list, e.g. ["self-hosted","wsl"]); the default is a GitHub-hosted runner.
# Managed by lfofelipe2-ux/claude-github-setup: edit the template there, not here.
name: claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Filters the author before taking a runner; only the owner, members and collaborators can trigger it.
    if: >
      github.event.sender.type != 'Bot' && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)))
    runs-on: ${{ fromJSON(vars.CLAUDE_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model ${{ vars.CLAUDE_ACTION_MODEL || 'claude-opus-5-5' }}
            --max-turns 40
            --append-system-prompt "Reply in pt-BR; code, commits and files in English. If AGENTS.md or CLAUDE.md exists at the repository root, read and follow it."
